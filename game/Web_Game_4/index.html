<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 NEON SNAKE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --neon-green: #00ff88;
    --neon-pink: #ff0080;
    --neon-blue: #00d4ff;
    --neon-yellow: #ffff00;
    --dark: #050510;
    --grid: #0a0a2e;
    --glow-green: 0 0 10px #00ff88, 0 0 30px #00ff88, 0 0 60px #00ff8866;
    --glow-pink: 0 0 10px #ff0080, 0 0 30px #ff0080, 0 0 60px #ff008066;
    --glow-blue: 0 0 10px #00d4ff, 0 0 30px #00d4ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    position: relative;
  }

  /* Scanline effect */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .title {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: var(--neon-green);
    text-shadow: var(--glow-green);
    letter-spacing: 0.15em;
    margin-bottom: 8px;
    animation: flicker 4s infinite;
  }

  .subtitle {
    font-size: 0.45rem;
    color: var(--neon-blue);
    letter-spacing: 0.3em;
    text-shadow: var(--glow-blue);
    margin-bottom: 24px;
    opacity: 0.8;
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.6; }
    97% { opacity: 1; }
    98% { opacity: 0.4; }
    99% { opacity: 1; }
  }

  .hud {
    display: flex;
    gap: 40px;
    margin-bottom: 16px;
    align-items: center;
  }

  .hud-box {
    text-align: center;
  }

  .hud-label {
    font-size: 0.35rem;
    color: var(--neon-blue);
    letter-spacing: 0.2em;
    opacity: 0.7;
    margin-bottom: 4px;
  }

  .hud-value {
    font-size: 1rem;
    color: var(--neon-yellow);
    text-shadow: 0 0 10px #ffff00, 0 0 30px #ffff0066;
  }

  .game-wrapper {
    position: relative;
    border: 2px solid var(--neon-green);
    box-shadow: var(--glow-green), inset 0 0 40px rgba(0,255,136,0.03);
    border-radius: 4px;
  }

  canvas {
    display: block;
    background: var(--grid);
    image-rendering: pixelated;
  }

  /* Corner decorations */
  .corner {
    position: absolute;
    width: 12px;
    height: 12px;
    border-color: var(--neon-pink);
    border-style: solid;
    box-shadow: var(--glow-pink);
  }
  .corner.tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
  .corner.tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
  .corner.bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }
  .corner.br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,5,16,0.88);
    gap: 20px;
    z-index: 10;
  }

  .overlay.hidden { display: none; }

  .overlay-title {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(1rem, 3vw, 1.8rem);
    color: var(--neon-pink);
    text-shadow: var(--glow-pink);
    text-align: center;
    line-height: 1.4;
  }

  .overlay-sub {
    font-size: 0.4rem;
    color: var(--neon-blue);
    text-align: center;
    line-height: 2;
    opacity: 0.85;
  }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.55rem;
    padding: 12px 28px;
    background: transparent;
    border: 2px solid var(--neon-green);
    color: var(--neon-green);
    cursor: pointer;
    letter-spacing: 0.15em;
    box-shadow: var(--glow-green);
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--neon-green);
    opacity: 0;
    transition: opacity 0.15s;
  }

  .btn:hover::before { opacity: 0.15; }
  .btn:hover { box-shadow: var(--glow-green), 0 0 80px rgba(0,255,136,0.3); }
  .btn:active { transform: scale(0.97); }

  .btn span { position: relative; z-index: 1; }

  .controls {
    margin-top: 16px;
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 0.3rem;
    color: rgba(0,212,255,0.5);
    letter-spacing: 0.15em;
  }

  .key {
    display: inline-block;
    padding: 3px 7px;
    border: 1px solid rgba(0,212,255,0.4);
    color: rgba(0,212,255,0.7);
    font-size: 0.3rem;
    border-radius: 2px;
  }

  /* Mobile D-pad */
  .dpad {
    display: none;
    margin-top: 20px;
    position: relative;
    width: 120px;
    height: 120px;
  }

  .dpad-btn {
    position: absolute;
    width: 36px;
    height: 36px;
    background: rgba(0,255,136,0.1);
    border: 1.5px solid var(--neon-green);
    color: var(--neon-green);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    box-shadow: 0 0 6px rgba(0,255,136,0.4);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn:active { background: rgba(0,255,136,0.25); }
  .dpad-up    { top: 0;   left: 42px; }
  .dpad-down  { bottom: 0; left: 42px; }
  .dpad-left  { top: 42px; left: 0; }
  .dpad-right { top: 42px; right: 0; }

  @media (max-width: 600px) {
    .dpad { display: grid; }
    .controls { display: none; }
  }

  .level-badge {
    font-size: 0.35rem;
    color: var(--neon-pink);
    text-shadow: var(--glow-pink);
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>

<div class="title">NEON SNAKE</div>
<div class="subtitle">▸ ARCADE EDITION ◂</div>

<div class="hud">
  <div class="hud-box">
    <div class="hud-label">SCORE</div>
    <div class="hud-value" id="score">000</div>
  </div>
  <div class="hud-box">
    <div class="level-badge" id="level-badge">LV.1</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">BEST</div>
    <div class="hud-value" id="best">000</div>
  </div>
</div>

<div class="game-wrapper">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <canvas id="canvas"></canvas>

  <div class="overlay" id="overlay">
    <div class="overlay-title" id="overlay-title">NEON SNAKE</div>
    <div class="overlay-sub" id="overlay-sub">
      吃掉食物讓蛇變長<br>
      撞牆或咬到自己就 GAME OVER
    </div>
    <button class="btn" id="start-btn"><span>▶ START</span></button>
  </div>
</div>

<div class="controls">
  <span><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 或 方向鍵移動</span>
  <span><span class="key">P</span> 暫停</span>
</div>

<div class="dpad">
  <div class="dpad-btn dpad-up"    data-dir="UP">▲</div>
  <div class="dpad-btn dpad-left"  data-dir="LEFT">◀</div>
  <div class="dpad-btn dpad-right" data-dir="RIGHT">▶</div>
  <div class="dpad-btn dpad-down"  data-dir="DOWN">▼</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Responsive sizing
const isMobile = window.innerWidth <= 600;
const CELL = isMobile ? 14 : 18;
const COLS = isMobile ? 22 : 28;
const ROWS = isMobile ? 22 : 28;
canvas.width  = COLS * CELL;
canvas.height = ROWS * CELL;

// Game state
let snake, dir, nextDir, food, bonus, score, best, running, paused, gameOver, level, tick, tickInterval;

const COLORS = {
  snakeHead: '#00ff88',
  snakeBody: ['#00ff88','#00e87a','#00cc6a','#00b05a'],
  food: '#ff0080',
  bonus: '#ffff00',
  gridLine: 'rgba(0,212,255,0.04)',
  bg: '#050510',
};

function init() {
  const mid = Math.floor(COLS / 2);
  const midR = Math.floor(ROWS / 2);
  snake = [
    {x: mid, y: midR},
    {x: mid-1, y: midR},
    {x: mid-2, y: midR},
  ];
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  score = 0;
  level = 1;
  tick = 0;
  food = spawnFood();
  bonus = null;
  gameOver = false;
  paused = false;
  updateHUD();
}

function spawnFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while (snake.some(s => s.x===pos.x && s.y===pos.y));
  return pos;
}

function spawnBonus() {
  if (bonus) return;
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while (snake.some(s => s.x===pos.x && s.y===pos.y) || (food.x===pos.x && food.y===pos.y));
  bonus = {...pos, timer: 80};
}

function getSpeed() {
  return Math.max(60, 160 - (level-1)*18);
}

function updateHUD() {
  document.getElementById('score').textContent = String(score).padStart(3,'0');
  document.getElementById('best').textContent  = String(best||0).padStart(3,'0');
  document.getElementById('level-badge').textContent = `LV.${level}`;
}

// Drawing
function drawGrid() {
  ctx.strokeStyle = COLORS.gridLine;
  ctx.lineWidth = 0.5;
  for (let x=0; x<=COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,ROWS*CELL); ctx.stroke();
  }
  for (let y=0; y<=ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(COLS*CELL,y*CELL); ctx.stroke();
  }
}

function drawSnake() {
  snake.forEach((seg, i) => {
    const t = i / snake.length;
    const alpha = 1 - t * 0.55;
    if (i === 0) {
      // Head — bright with glow
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = 20;
      ctx.fillStyle = `rgba(0,255,136,${alpha})`;
    } else {
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00ff88';
      const g = Math.floor(160 + (1-t)*95);
      ctx.fillStyle = `rgba(0,${g},100,${alpha})`;
    }
    const pad = i === 0 ? 1 : 2;
    ctx.fillRect(seg.x*CELL+pad, seg.y*CELL+pad, CELL-pad*2, CELL-pad*2);

    // Eyes on head
    if (i === 0) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#050510';
      const ex = dir.x, ey = dir.y;
      const cx = seg.x*CELL + CELL/2, cy = seg.y*CELL + CELL/2;
      const es = CELL > 14 ? 2 : 1.5;
      const off = CELL * 0.18;
      ctx.fillRect(cx + ex*off - ey*off - es/2, cy + ey*off + ex*off - es/2, es, es);
      ctx.fillRect(cx + ex*off + ey*off - es/2, cy + ey*off - ex*off - es/2, es, es);
    }
  });
  ctx.shadowBlur = 0;
}

function drawFood() {
  const cx = food.x*CELL + CELL/2, cy = food.y*CELL + CELL/2;
  const r = CELL/2 - 2;
  const pulse = 0.7 + 0.3 * Math.sin(Date.now()/200);

  ctx.shadowColor = '#ff0080';
  ctx.shadowBlur = 15 * pulse;
  ctx.fillStyle = `rgba(255,0,128,${0.8 + 0.2*pulse})`;
  ctx.beginPath(); ctx.arc(cx, cy, r * pulse, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // ✕ symbol
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx-r*0.4, cy-r*0.4); ctx.lineTo(cx+r*0.4, cy+r*0.4);
  ctx.moveTo(cx+r*0.4, cy-r*0.4); ctx.lineTo(cx-r*0.4, cy+r*0.4);
  ctx.stroke();
}

function drawBonus() {
  if (!bonus) return;
  const cx = bonus.x*CELL + CELL/2, cy = bonus.y*CELL + CELL/2;
  const r = CELL/2 - 2;
  const fade = bonus.timer / 80;
  const pulse = 0.8 + 0.2 * Math.sin(Date.now()/120);

  ctx.shadowColor = '#ffff00';
  ctx.shadowBlur = 20 * pulse;
  ctx.fillStyle = `rgba(255,220,0,${fade * pulse})`;
  ctx.beginPath(); ctx.arc(cx, cy, r*pulse, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = `rgba(5,5,16,${fade})`;
  ctx.font = `bold ${Math.floor(CELL*0.55)}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', cx, cy+1);
}

// Particles
let particles = [];
function addParticles(x, y, color) {
  for (let i=0; i<10; i++) {
    const angle = Math.random()*Math.PI*2;
    const speed = 1 + Math.random()*3;
    particles.push({
      x: x*CELL+CELL/2, y: y*CELL+CELL/2,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 1, color
    });
  }
}
function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.08;
    p.life -= 0.04;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.fillStyle = p.color + Math.floor(p.life*255).toString(16).padStart(2,'0');
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
  });
  ctx.shadowBlur = 0;
}

function draw() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  updateParticles();
  drawFood();
  drawBonus();
  drawSnake();
}

// Game loop
function step() {
  if (!running || paused || gameOver) return;
  tick++;

  dir = {...nextDir};
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    endGame(); return;
  }
  // Self collision
  if (snake.some(s => s.x===head.x && s.y===head.y)) {
    endGame(); return;
  }

  let grew = false;
  // Eat food
  if (head.x===food.x && head.y===food.y) {
    score += level * 10;
    grew = true;
    addParticles(food.x, food.y, '#ff0080');
    food = spawnFood();
    if (score % 100 === 0 && level < 9) level++;
    if (score % 50 === 0) spawnBonus();
    updateHUD();
    clearInterval(tickInterval);
    tickInterval = setInterval(step, getSpeed());
  }

  // Eat bonus
  if (bonus && head.x===bonus.x && head.y===bonus.y) {
    score += level * 30;
    addParticles(bonus.x, bonus.y, '#ffff00');
    bonus = null;
    updateHUD();
  }

  snake.unshift(head);
  if (!grew) snake.pop();

  // Bonus timer
  if (bonus) {
    bonus.timer--;
    if (bonus.timer <= 0) bonus = null;
  }

  if (score > (best||0)) { best = score; }
  draw();
}

function endGame() {
  gameOver = true;
  running = false;
  clearInterval(tickInterval);
  if (score > (best||0)) best = score;
  updateHUD();

  // Flash snake red
  let flashes = 0;
  const flashInterval = setInterval(() => {
    draw();
    // Red overlay flash
    ctx.fillStyle = `rgba(255,0,0,${flashes%2===0 ? 0.15 : 0})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    flashes++;
    if (flashes >= 6) {
      clearInterval(flashInterval);
      showOverlay('GAME OVER', `SCORE: ${String(score).padStart(3,'0')}  BEST: ${String(best).padStart(3,'0')}`, '▶ RETRY');
    }
  }, 100);
}

function showOverlay(title, sub, btn) {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-sub').innerHTML = sub.replace(/  /g,'<br>');
  document.getElementById('start-btn').querySelector('span').textContent = btn;
  document.getElementById('overlay').classList.remove('hidden');
}

function startGame() {
  document.getElementById('overlay').classList.add('hidden');
  init();
  running = true;
  clearInterval(tickInterval);
  tickInterval = setInterval(step, getSpeed());
  // draw loop for smooth animations
  requestAnimationFrame(function loop() {
    if (running || gameOver) draw();
    requestAnimationFrame(loop);
  });
}

// Controls
const DIRS = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
  w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
  W:{x:0,y:-1}, S:{x:0,y:1}, A:{x:-1,y:0}, D:{x:1,y:0},
};
document.addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P') {
    if (running && !gameOver) paused = !paused;
    return;
  }
  const d = DIRS[e.key];
  if (d && !(d.x===-dir.x && d.y===-dir.y)) {
    nextDir = d;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  }
});

// D-pad
document.querySelectorAll('.dpad-btn').forEach(btn => {
  const handler = () => {
    const map = {UP:{x:0,y:-1}, DOWN:{x:0,y:1}, LEFT:{x:-1,y:0}, RIGHT:{x:1,y:0}};
    const d = map[btn.dataset.dir];
    if (d && !(d.x===-dir.x && d.y===-dir.y)) nextDir = d;
  };
  btn.addEventListener('touchstart', e => { e.preventDefault(); handler(); }, {passive:false});
  btn.addEventListener('mousedown', handler);
});

document.getElementById('start-btn').addEventListener('click', startGame);

// Initial draw
draw();
</script>
</body>
</html>
