<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星際擺盪：極速獵殺 (HUNTER MODE)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700;800&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #020204;
            font-family: 'Oxanium', cursive;
            touch-action: none;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-box {
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 10px 20px;
            backdrop-filter: blur(4px);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .label {
            font-size: 0.9rem;
            color: #00ffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .value {
            font-size: 2.5rem;
            color: #fff;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            line-height: 1;
        }

        .threat-meter {
            width: 200px;
            height: 6px;
            background: #111;
            border: 1px solid #555;
            position: relative;
            overflow: hidden;
        }
        .threat-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #ff5500);
            width: 0%;
            transition: width 0.1s;
            box-shadow: 0 0 10px #ff0055;
        }
        .threat-fill.critical {
            animation: pulse-red 0.5s infinite alternate;
        }

        @keyframes pulse-red {
            from { background: #ff0055; box-shadow: 0 0 10px #ff0055; }
            to { background: #ffaaaa; box-shadow: 0 0 20px #ff0055; }
        }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(circle, transparent 60%, rgba(255, 0, 85, 0) 100%);
            transition: background 0.2s;
        }

        #cinematic-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .cine-text {
            font-size: 4rem;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: scale(0.9);
        }
        
        .cine-text.active {
            opacity: 1;
            transform: scale(1);
        }

        .cine-sub {
            font-size: 1.2rem;
            color: #00ffff;
            letter-spacing: 5px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.5s 0.2s;
        }
        .cine-sub.active { opacity: 1; }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 4, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        h1 {
            font-size: 5rem;
            color: #fff;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 4px 4px 0 #00ffff;
            letter-spacing: 5px;
            text-align: center;
        }
        h1 span { color: #ff0055; text-shadow: 4px 4px 0 #550022; }

        .brief {
            color: #aaa;
            margin-top: 20px;
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.6;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 20px 0;
            max-width: 600px;
        }

        button {
            margin-top: 40px;
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 15px 60px;
            font-size: 1.5rem;
            font-family: 'Oxanium', cursive;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        button:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
        }

        #input-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            cursor: crosshair;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas"></canvas>
    <div id="vignette"></div>
    
    <div id="cinematic-overlay">
        <div class="cine-text" id="cine-main"></div>
        <div class="cine-sub" id="cine-sub"></div>
    </div>

    <div id="ui-layer">
        <div class="hud-header">
            <div class="hud-box">
                <div class="label">Sync Distance</div>
                <div class="value" id="score-val">0</div>
            </div>
            <div class="hud-box" style="text-align: right;">
                <div class="label" style="color:#ff0055">Void Proximity</div>
                <div class="threat-meter">
                    <div class="threat-fill" id="threat-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="start-screen">
        <h1>Final <span>Frontier</span></h1>
        <div class="brief">
            // 威脅等級提升：虛空移動速度加快<br>
            // <span style="color:#00ffff">操作：</span> 按住畫面抓取，放開飛行<br>
            // <span style="color:#ff0055">警告：</span> 請保持高速移動以避免被吞噬
        </div>
        <button id="start-btn">INITIATE SEQUENCE</button>
    </div>

    <div id="input-zone"></div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const scoreEl = document.getElementById('score-val');
    const threatBar = document.getElementById('threat-bar');
    const vignette = document.getElementById('vignette');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    
    const cineMain = document.getElementById('cine-main');
    const cineSub = document.getElementById('cine-sub');

    let width, height;
    let gameState = 'MENU'; 
    let score = 0;
    let gameTime = 0;
    let animationFrameId = null; 
    let deathReasonText = "";
    
    // Input
    let isMouseDown = false;
    let needsNewClick = false; 

    // Camera
    let camera = { x: 0, y: 0, zoom: 1, shake: 0 };

    // Physics
    const GRAVITY = 0.25; 
    const DRAG = 0.995; 
    const HOOK_RANGE = 750;
    const HOOK_FORCE = 0.15; 
    const SWING_BOOST = 0.45; 
    const MAX_HOOK_TIME = 200; 

    // Bounds
    const DEATH_Y = 2500; 

    // Entities
    let particles = [];
    let nodes = [];
    
    const player = {
        x: 0, y: 0, vx: 0, vy: 0,
        radius: 12,
        trail: [],
        dead: false,
        visible: true 
    };

    // [調整] 虛空初始數值
    const voidWall = {
        x: -2000,
        speed: 8,      // 初始速度提升 (原本5)
        baseSpeed: 8,  // 基礎速度提升
        maxSpeed: 30   // 最大速度提升 (原本22)
    };

    let anchorNode = null;
    let anchorTime = 0;

    // --- Audio System ---
    class AudioController {
        constructor() {
            this.ctx = null;
            this.isInitialized = false;
        }

        init() {
            if (this.isInitialized) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
                this.isInitialized = true;
            } catch(e) {
                console.log("Audio not supported");
            }
        }

        updateDrone(dangerLevel) {}

        playHook() {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        }

        playBoost() {
            if (!this.ctx) return;
            const bufferSize = this.ctx.sampleRate * 0.5;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, this.ctx.currentTime);
            filter.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.2);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start();
        }

        playShatter() {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        }

        playGameOver() {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(20, this.ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.5);
        }
    }

    const audio = new AudioController();

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Classes ---

    class Node {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 6;
            this.active = false;
            this.stress = 0;
            this.shattered = false;
            this.pulse = Math.random() * Math.PI;
            this.color = '#00ffff'; 
            if (y < -400) this.color = '#ffff00'; 
            else if (y > 400) this.color = '#aa00ff'; 
        }

        draw(ctx, camX, camY, time) {
            if (this.shattered) return;
            const sx = this.x - camX;
            const sy = this.y - camY;
            if (sx < -50 || sx > width/camera.zoom + 50 || sy < -50 || sy > height/camera.zoom + 50) return;

            let shake = this.stress > 0 ? (Math.random()-0.5)*this.stress*6 : 0;
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let p = Math.sin(time*0.1 + this.pulse)*2;
            ctx.arc(sx+shake, sy+shake, this.radius + 8 + p, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = this.stress > 0.5 ? '#fff' : this.color;
            ctx.beginPath();
            ctx.arc(sx+shake, sy+shake, this.radius, 0, Math.PI*2);
            ctx.fill();
            if (this.active) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(sx+shake, sy+shake, this.radius + 14, 0, Math.PI*2);
                ctx.stroke();
            }
        }
    }

    class Particle {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type; 
            let speed = Math.random() * 2 + 1;
            let angle = Math.random() * Math.PI * 2;
            
            if (type === 'boost') {
                this.color = '#00ffff';
                angle = Math.PI + (Math.random()-0.5); 
                speed = Math.random() * 5 + 5;
                this.life = 0.6;
                this.size = 2;
            } else if (type === 'void') {
                this.color = '#ff0055';
                angle = 0;
                speed = Math.random() * 12 + 5;
                this.life = 0.8;
                this.size = 3;
            } else if (type === 'shatter') {
                this.color = '#fff';
                this.life = 1.2; 
                speed *= 6; 
                this.size = 4;
            } else {
                this.color = '#fff';
                this.size = 2;
                this.life = 1.0;
            }

            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
        }
        
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 0.02;
        }

        draw(ctx, camX, camY) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x - camX, this.y - camY, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    // --- Game Logic ---

    function resetGame() {
        player.x = 0; player.y = 0;
        player.vx = 0; player.vy = 0;
        player.dead = false;
        player.visible = true; 
        player.trail = [];
        
        score = 0;
        nodes = [];
        particles = [];
        gameTime = 0;
        
        anchorNode = null;
        anchorTime = 0;
        isMouseDown = false;
        needsNewClick = false;
        
        voidWall.x = -2500;
        voidWall.speed = voidWall.baseSpeed;
        
        camera.x = -width/2;
        camera.y = -height/2;
        camera.zoom = 1;
        camera.shake = 0;
        
        generateNodes(-200, 3000);
        
        scoreEl.innerText = '0';
        threatBar.style.width = '0%';
        vignette.style.background = 'none';
        
        cineMain.className = 'cine-text';
        cineSub.className = 'cine-sub';
    }

    function generateNodes(startX, endX) {
        let x = startX;
        while(x < endX) {
            let gap = 200 + Math.random() * 100;
            x += gap;
            let flowY = Math.sin(x * 0.002) * 400; 

            nodes.push(new Node(x, flowY + (Math.random()-0.5)*200));

            if (Math.random() < 0.6) {
                nodes.push(new Node(x, flowY - 500 - Math.random()*200));
            }

            if (Math.random() < 0.8) {
                nodes.push(new Node(x, flowY + 500 + Math.random()*200));
            }
            
            if (flowY < -300) nodes.push(new Node(x, 800)); 
            if (flowY > 300) nodes.push(new Node(x, -800)); 
        }
    }

    function findSmartNode() {
        let best = null;
        let score = -Infinity;
        
        for (let n of nodes) {
            if (n.shattered) continue;
            let dx = n.x - player.x;
            let dy = n.y - player.y;
            
            if (Math.hypot(dx, dy) > HOOK_RANGE) continue;

            let s = -Math.hypot(dx, dy); 
            if (dx > 0) s += 10000; 
            else s -= 10000;
            
            if (s > score) {
                score = s;
                best = n;
            }
        }
        return best;
    }

    function startIntro() {
        if(animationFrameId) cancelAnimationFrame(animationFrameId);
        
        gameState = 'INTRO';
        resetGame();
        audio.init();
        
        let timer = 0;
        let duration = 200; 
        
        function introLoop() {
            if (gameState !== 'INTRO') return;
            timer++;

            let startX = voidWall.x - width/2 + 300;
            let endX = player.x - width/2;
            
            let t = Math.min(1, timer / (duration * 0.8));
            t = t * t * (3 - 2 * t);
            
            camera.x = startX + (endX - startX) * t;
            camera.y = -height/2;

            if (timer === 10) {
                showText("警告", "偵測到虛空反應", "#ff0055");
            } else if (timer === 100) {
                showText("系統", "引擎連線正常", "#00ffff");
            } else if (timer === 160) {
                showText("發射", "", "#fff");
            }

            if (timer >= duration) {
                gameState = 'PLAYING';
                player.vx = 15; 
                hideText();
                gameLoop(); 
                return;
            }
            
            if(Math.random()<0.3) particles.push(new Particle(voidWall.x + Math.random()*300, (Math.random()-0.5)*height, 'void'));

            draw();
            animationFrameId = requestAnimationFrame(introLoop);
        }
        animationFrameId = requestAnimationFrame(introLoop);
    }

    function showText(main, sub, color) {
        cineMain.innerText = main;
        cineMain.style.color = color;
        cineMain.style.textShadow = `0 0 20px ${color}`;
        cineMain.classList.remove('active');
        void cineMain.offsetWidth; 
        cineMain.classList.add('active');

        cineSub.innerText = sub;
        cineSub.classList.remove('active');
        if(sub) {
            void cineSub.offsetWidth;
            cineSub.classList.add('active');
        }
    }

    function hideText() {
        cineMain.classList.remove('active');
        cineSub.classList.remove('active');
    }

    function shatterPlayer() {
        if (!player.visible) return; 
        player.visible = false; 
        audio.playShatter();
        addShake(20);
        for(let i=0; i<30; i++) {
            particles.push(new Particle(player.x, player.y, 'shatter'));
        }
    }

    function startDyingSequence(reason) {
        gameState = 'DYING';
        deathReasonText = reason;
        setTimeout(() => {
            gameOver(reason);
        }, 1500);
    }

    function update() {
        gameTime++; 

        if (gameState === 'DYING') {
            voidWall.x += 40; 
            if (player.visible && voidWall.x > player.x) {
                shatterPlayer();
            }
            for(let i=particles.length-1; i>=0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            camera.x += (voidWall.x - width/2 - camera.x) * 0.05;
            return; 
        }

        let targetSpeed = voidWall.baseSpeed + (score / 40); // 分數影響更大 (was 60)
        if (targetSpeed > voidWall.maxSpeed) targetSpeed = voidWall.maxSpeed;
        
        let distToVoid = player.x - voidWall.x;

        // 橡皮筋機制調整：只要拉開距離就加速
        if (distToVoid > 2500) { // was 3500
            let catchUpSpeed = targetSpeed * 2.0; // 加速倍率提升 (was 1.5)
            voidWall.speed += (catchUpSpeed - voidWall.speed) * 0.03;
        } else if (distToVoid < 800) { // was 1200 - 更晚煞車
            let slowDownSpeed = targetSpeed * 0.9;
            voidWall.speed += (slowDownSpeed - voidWall.speed) * 0.1;
        } else {
            voidWall.speed += (targetSpeed - voidWall.speed) * 0.05;
        }
        
        voidWall.x += voidWall.speed;

        if (player.x < voidWall.x + 300) {
            startDyingSequence("SIGNAL CONSUMED (吞噬)");
            return;
        }

        if (player.y < -DEATH_Y || player.y > DEATH_Y) {
            shatterPlayer(); 
            gameOver("SIGNAL LOST (OUT OF BOUNDS)");
            return;
        }

        let danger = Math.max(0, 1 - (distToVoid - 300) / 2500);
        threatBar.style.width = `${danger*100}%`;
        
        let heightDanger = Math.max(0, (Math.abs(player.y) - (DEATH_Y - 500)) / 500);
        
        if (danger > 0.4 || heightDanger > 0.2) {
            let totalDanger = Math.max(danger, heightDanger);
            let opacity = totalDanger * 0.8;
            vignette.style.background = `radial-gradient(circle, transparent 40%, rgba(255, 0, 85, ${opacity}) 100%)`;
            addShake(totalDanger * 2);
        } else {
            vignette.style.background = 'none';
        }

        let lastNode = nodes[nodes.length-1];
        if (player.x + width/camera.zoom * 2 > lastNode.x) {
            generateNodes(lastNode.x, lastNode.x + 2000);
        }
        while(nodes.length > 0 && nodes[0].x < camera.x - width/camera.zoom) nodes.shift();

        let targetNode = findSmartNode();

        if (isMouseDown && !needsNewClick && !anchorNode && targetNode) {
            anchorNode = targetNode;
            anchorNode.active = true;
            anchorTime = 0;
            needsNewClick = true; 
            addShake(4);
            audio.playHook(); 
            for(let i=0; i<6; i++) particles.push(new Particle(targetNode.x, targetNode.y, 'boost'));
        }

        if (anchorNode) {
            anchorTime++;
            anchorNode.stress = anchorTime / MAX_HOOK_TIME;

            if (anchorTime > MAX_HOOK_TIME) {
                anchorNode.shattered = true;
                anchorNode.active = false;
                anchorNode = null;
                addShake(15);
                audio.playBoost();
                for(let i=0; i<10; i++) particles.push(new Particle(player.x, player.y, 'shatter'));
            } else {
                let dx = anchorNode.x - player.x;
                let dy = anchorNode.y - player.y;
                let dist = Math.hypot(dx, dy);
                let nx = dx / dist;
                let ny = dy / dist;

                let force = HOOK_FORCE * (dist * 0.015);
                player.vx += nx * force;
                player.vy += ny * force;

                if (player.vx < 30) {
                    player.vx += SWING_BOOST; 
                }

                if (dist > 100) {
                    player.vx += nx * 0.1;
                    player.vy += ny * 0.1;
                }

                player.vx *= 0.999;
                player.vy *= 0.999;

                if (gameTime % 4 === 0) particles.push(new Particle(player.x, player.y, 'boost'));
            }
        } else {
            player.vy += GRAVITY;
            player.vx *= DRAG;
            player.vy *= DRAG;
            if (player.vx < 8) player.vx += 0.05; 
        }

        player.x += player.vx;
        player.y += player.vy;

        player.trail.push({x: player.x, y: player.y});
        if (player.trail.length > 25) player.trail.shift();

        let s = Math.floor(player.x / 100);
        if (s > score) {
            score = s;
            scoreEl.innerText = score;
        }

        let playerSpeed = Math.hypot(player.vx, player.vy);
        let targetZ = 1.0 - Math.min(0.4, playerSpeed / 70);
        camera.targetZoom = targetZ;
        camera.zoom += (camera.targetZoom - camera.zoom) * 0.05;

        let vw = width / camera.zoom;
        let vh = height / camera.zoom;
        
        let lookAhead = player.vx * 15;
        let targetCamX = player.x - vw * 0.5 + lookAhead;
        let targetCamY = player.y - vh * 0.5 + player.vy * 8;

        camera.x += (targetCamX - camera.x) * 0.1;
        camera.y += (targetCamY - camera.y) * 0.1;
        
        if (camera.shake > 0) {
            camera.x += (Math.random()-0.5) * camera.shake;
            camera.y += (Math.random()-0.5) * camera.shake;
            camera.shake *= 0.9;
            if (camera.shake < 0.5) camera.shake = 0;
        }

        for(let i=particles.length-1; i>=0; i--) {
            particles[i].update();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }
    }

    function addShake(amt) {
        camera.shake = Math.min(camera.shake + amt, 25);
    }

    function draw() {
        ctx.fillStyle = '#020204';
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.scale(camera.zoom, camera.zoom);
        let camX = camera.x;
        let camY = camera.y;

        // Grid
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        let gridSize = 250;
        let offX = camX % gridSize;
        let offY = camY % gridSize;
        let vw = width / camera.zoom;
        let vh = height / camera.zoom;
        
        ctx.beginPath();
        for(let x = -gridSize; x < vw + gridSize; x+=gridSize) {
            ctx.moveTo(x - offX, -vh); ctx.lineTo(x - offX, vh*2);
        }
        for(let y = -gridSize; y < vh + gridSize; y+=gridSize) {
            ctx.moveTo(-vw, y - offY); ctx.lineTo(vw*2, y - offY);
        }
        ctx.stroke();

        // Death Bounds
        ctx.fillStyle = 'rgba(255, 0, 85, 0.15)';
        ctx.fillRect(voidWall.x - camX - 1000, -DEATH_Y - camY - 1000, 100000, 1000); 
        ctx.fillRect(voidWall.x - camX - 1000, DEATH_Y - camY, 100000, 1000); 

        // Void Wall (Back Layer)
        let voidScreenX = voidWall.x - camX;
        
        // 戰術線
        let smartNode = findSmartNode();
        if (smartNode && !anchorNode && player.visible) {
            const sx = smartNode.x - camX;
            const sy = smartNode.y - camY;
            const px = player.x - camX;
            const py = player.y - camY;

            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(sx, sy);
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([15, 10]);
            ctx.lineDashOffset = -gameTime * 2;
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(gameTime * 0.05);
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            let r = 22;
            ctx.moveTo(-r, -r + 8); ctx.lineTo(-r, -r); ctx.lineTo(-r + 8, -r);
            ctx.moveTo(r - 8, -r); ctx.lineTo(r, -r); ctx.lineTo(r, -r + 8);
            ctx.moveTo(r, r - 8); ctx.lineTo(r, r); ctx.lineTo(r - 8, r);
            ctx.moveTo(-r + 8, r); ctx.lineTo(-r, r); ctx.lineTo(-r, r - 8);
            ctx.stroke();
            ctx.restore();

            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 12px Oxanium';
            ctx.fillText("TARGET", sx + 25, sy + 4);
        }

        // Rope
        if (anchorNode && !anchorNode.shattered && player.visible) {
            ctx.beginPath();
            ctx.moveTo(player.x - camX, player.y - camY);
            ctx.lineTo(anchorNode.x - camX, anchorNode.y - camY);
            let energy = anchorNode.stress;
            ctx.strokeStyle = energy > 0.7 ? '#ff0055' : '#00ffff';
            ctx.lineWidth = 3 + energy * 4;
            ctx.stroke();
        }

        nodes.forEach(n => n.draw(ctx, camX, camY, gameTime));
        particles.forEach(p => p.draw(ctx, camX, camY));

        // Player (只在存活時繪製)
        if (player.visible) {
            const px = player.x - camX;
            const py = player.y - camY;

            if (player.trail.length > 1) {
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                for(let i=0; i<player.trail.length-1; i++) {
                    ctx.moveTo(player.trail[i].x - camX, player.trail[i].y - camY);
                    ctx.lineTo(player.trail[i+1].x - camX, player.trail[i+1].y - camY);
                }
                ctx.stroke();
            }

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(px, py, player.radius, 0, Math.PI*2);
            ctx.fill();
        }

        // [關鍵修改] 虛空牆繪製在最上層 (DYING 狀態)
        if (voidScreenX > -vw) {
            let grad = ctx.createLinearGradient(voidScreenX-200, 0, voidScreenX, 0);
            grad.addColorStop(0, '#000');
            grad.addColorStop(1, 'rgba(255, 0, 85, 0.8)');
            ctx.fillStyle = grad;
            ctx.fillRect(voidScreenX - 1000, -vh*2, 1000, vh * 5); 

            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(voidScreenX, -vh*2);
            ctx.lineTo(voidScreenX, vh * 5);
            ctx.stroke();
        }

        ctx.restore();
    }

    function gameOver(reason) {
        gameState = 'DEAD';
        audio.playGameOver();
        startScreen.style.display = 'flex';
        document.querySelector('h1').innerHTML = "SYSTEM <span>FAILURE</span>";
        document.querySelector('.brief').innerHTML = 
            `CAUSE: ${reason}<br>DISTANCE: <span style="color:#00ffff">${score}</span>`;
        startBtn.innerText = "REBOOT SYSTEM";
    }

    function gameLoop() {
        if (gameState === 'PLAYING' || gameState === 'DYING') {
            update();
            draw();
        }
        animationFrameId = requestAnimationFrame(gameLoop);
    }

    // Input
    const inputZone = document.getElementById('input-zone');
    
    function startInput(e) { 
        if(e.cancelable) e.preventDefault(); 
        if (gameState === 'PLAYING') isMouseDown = true; 
    }
    
    function endInput(e) { 
        if(e.cancelable) e.preventDefault(); 
        isMouseDown = false; 
        
        if(anchorNode && !player.dead) {
             anchorNode.active = false;
             anchorNode = null;
             
             player.vx *= 1.1; 
             player.vy *= 1.1; 
             audio.playBoost();
             for(let k=0; k<3; k++) particles.push(new Particle(player.x, player.y, 'boost'));
        }
        needsNewClick = false; 
    }

    inputZone.addEventListener('mousedown', startInput);
    inputZone.addEventListener('mouseup', endInput);
    inputZone.addEventListener('touchstart', startInput, {passive: false});
    inputZone.addEventListener('touchend', endInput, {passive: false});
    window.addEventListener('mouseup', () => {
        isMouseDown = false; needsNewClick = false;
        if (anchorNode) { anchorNode.active = false; anchorNode = null; }
    });

    startBtn.addEventListener('click', () => {
        startScreen.style.display = 'none';
        startIntro();
    });

    resetGame();
    draw();

</script>
</body>
